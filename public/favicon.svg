<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16233f"/>
      <stop offset="100%" stop-color="#070b16"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#7b2bff"/>
    </linearGradient>
  </defs>
  <!-- 底:賽博暗藍圓角方塊 -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#bg)" stroke="#00f0ff" stroke-width="1.4" stroke-opacity="0.55"/>
  <!-- 環太平洋地球儀 -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.95"/>
  <ellipse cx="16" cy="16" rx="4.4" ry="9.5" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="9" y1="9.2" x2="23" y2="22.8" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.35"/>
  <!-- 貿易戰航線(霓虹弧 + 兩端節點) -->
  <path d="M8 22 Q16 4 24 12" fill="none" stroke="url(#route)" stroke-width="2.1" stroke-linecap="round"/>
  <circle cx="8" cy="22" r="2" fill="#ff2bd6"/>
  <circle cx="24" cy="12" r="2" fill="#ffb000"/>
</svg>
